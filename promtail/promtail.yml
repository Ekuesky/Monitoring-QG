server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: koda_docker_logs
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # Capture le nom du conteneur
      - source_labels: [__meta_docker_container_name]
        regex: '/(.*)'
        target_label: container_name
      # Filtre uniquement les conteneurs Koda ou de la stack de monitoring
      - source_labels: [__meta_docker_container_name]
        regex: '/(koda_.*)'
        action: keep
