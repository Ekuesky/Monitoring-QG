# =============================================================================
# Configuration Promtail — QG Multi-projets
# Collecte les logs de TOUS les conteneurs Docker de l'hôte.
# Le label "project" est extrait automatiquement depuis le label Docker
# "project=<nom>" posé sur chaque conteneur.
# =============================================================================

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: all_docker_logs
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # Extraire le nom du conteneur (sans le slash initial)
      - source_labels: [__meta_docker_container_name]
        regex: '/(.*)'
        target_label: container_name

      # Récupérer le label Docker "project" → label Loki "project"
      - source_labels: [__meta_docker_container_label_project]
        target_label: project

      # Récupérer le label Docker "service" → label Loki "service"
      - source_labels: [__meta_docker_container_label_service]
        target_label: service

      # Garder TOUS les conteneurs (aucun filtre par projet)
      - action: keep
        source_labels: [container_name]
        regex: '.+'
