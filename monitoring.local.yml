# =============================================================================
# Monitoring QG — Surcouche Environnement Local (Développement)
#
# Usage :
#   docker compose -f monitoring.yml -f monitoring.local.yml up -d
#
# Pour inclure Uptime Kuma en local (optionnel, économise ~200 Mo RAM sans lui) :
#   docker compose -f monitoring.yml -f monitoring.local.yml --profile optional up -d
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # PROMETHEUS — Rétention allégée (2 jours au lieu de 30) pour économiser disque & RAM
  # ---------------------------------------------------------------------------
  prometheus:
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=2d"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--web.enable-lifecycle"

  # ---------------------------------------------------------------------------
  # UPTIME KUMA — Profil optionnel pour ne pas consommer de RAM inutile en dev
  # ---------------------------------------------------------------------------
  uptime_kuma:
    profiles:
      - optional

  # ---------------------------------------------------------------------------
  # EXPORTERS — Ports publiés sur localhost pour faciliter le test curl / debug
  # ---------------------------------------------------------------------------
  postgres_exporter_koda:
    ports:
      - "127.0.0.1:9187:9187"

  redis_exporter_koda:
    ports:
      - "127.0.0.1:9121:9121"

  nginx_exporter_koda:
    ports:
      - "127.0.0.1:9113:9113"
