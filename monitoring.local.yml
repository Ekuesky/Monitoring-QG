# =============================================================================
# Monitoring QG — Surcouche Environnement Local (Développement - STRICT MINIMUM)
#
# Par défaut, cette surcouche ne démarre QUE le strict minimum vital :
#   - Prometheus (métriques, rétention 2j)
#   - Grafana (visualisation)
#   - Exporters applicatifs (Postgres, Redis, Nginx de Koda)
#
# Services superflus désactivés par défaut (profils optionnels) :
#   - Loki & Alloy     : profil 'logs'    (économise ~250 Mo RAM)
#   - cAdvisor         : profil 'system'  (économise ~100 Mo RAM)
#   - Alertmanager     : profil 'alerts'  (économise ~40 Mo RAM)
#   - Uptime Kuma      : profil 'kuma'    (économise ~200 Mo RAM)
#
# USAGE :
#   make local                -> Strict minimum (5 conteneurs, ~300 Mo RAM)
#   make local-logs           -> Strict minimum + Loki & Alloy
#   make local-full           -> Tous les services locaux
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # PROMETHEUS — Rétention allégée (2 jours au lieu de 30)
  # ---------------------------------------------------------------------------
  prometheus:
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=2d"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--web.enable-lifecycle"

  # ---------------------------------------------------------------------------
  # SERVICES DÉSACTIVÉS PAR DÉFAUT (Activables à la demande via profils)
  # ---------------------------------------------------------------------------

  # Alertmanager : inutile en dev (personne ne veut être alerté pendant qu'il code)
  alertmanager:
    profiles:
      - alerts
      - full

  # Loki & Alloy : inutiles si on consulte les logs dans le terminal
  loki:
    profiles:
      - logs
      - full

  alloy:
    profiles:
      - logs
      - full

  # Uptime Kuma : inutile pour sonder localhost
  uptime_kuma:
    profiles:
      - kuma
      - full

