# =============================================================================
# Configuration Prometheus — QG Multi-projets
#
# Chaque job porte un label "project" pour segmenter les métriques.
# POUR AJOUTER UN PROJET : décommenter/dupliquer les blocs commentés.
# Hot-reload sans redémarrage : curl -X POST http://localhost:19090/-/reload
# =============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

rule_files:
  - "alerts.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

# =============================================================================
# SCRAPE CONFIGURATIONS
# =============================================================================
scrape_configs:

  # ---------------------------------------------------------------------------
  # Prometheus — auto-monitoring
  # ---------------------------------------------------------------------------
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # ---------------------------------------------------------------------------
  # cAdvisor — métriques de TOUS les conteneurs Docker de l'hôte
  # ---------------------------------------------------------------------------
  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]
    metric_relabel_configs:
      # Propager container_label_project vers le label standard "project"
      - source_labels: [container_label_project]
        regex: "(.+)"
        target_label: project
      # Fallback : Si container_label_project n'est pas défini, utiliser le nom du projet Docker Compose
      - source_labels: [project, container_label_com_docker_compose_project]
        regex: ";(.+)"
        target_label: project

  # ---------------------------------------------------------------------------
  # Node Exporter — métriques matérielles de l'hôte (CPU, RAM, Disque)
  # Actif en production (monitoring.prod.yml)
  # ---------------------------------------------------------------------------
  - job_name: "node_exporter"
    static_configs:
      - targets: ["node_exporter:9100"]

  # ===========================================================================
  # KODA — Jobs par type de service
  # ===========================================================================

  # PostgreSQL — Koda
  - job_name: "postgres"
    static_configs:
      - targets: ["postgres_exporter_koda:9187"]
        labels:
          project: "koda"
          service: "postgres"
      # — ProjetX (décommenter pour ajouter) —
      # - targets: ["postgres_exporter_projetx:9187"]
      #   labels:
      #     project: "projetx"
      #     service: "postgres"

  # Redis — Koda
  - job_name: "redis"
    static_configs:
      - targets: ["redis_exporter_koda:9121"]
        labels:
          project: "koda"
          service: "redis"
      # - targets: ["redis_exporter_projetx:9121"]
      #   labels:
      #     project: "projetx"
      #     service: "redis"

  # Nginx — Koda
  - job_name: "nginx"
    static_configs:
      - targets: ["nginx_exporter_koda:9113"]
        labels:
          project: "koda"
          service: "nginx"

  # Celery Flower — Koda
  # Flower expose /metrics nativement sur :5555 (pas d'exporter supplémentaire)
  # Prometheus se connecte directement via koda_network → koda_flower
  - job_name: "flower"
    metrics_path: /metrics
    static_configs:
      - targets: ["koda_flower:5555"]
        labels:
          project: "koda"
          service: "celery"

  # ===========================================================================
  # <ProjetX> — Jobs par type de service (dupliquer ce bloc)
  # ===========================================================================

  # - job_name: "postgres_projetx"
  #   static_configs:
  #     - targets: ["postgres_exporter_projetx:9187"]
  #       labels:
  #         project: "projetx"
  #         service: "postgres"
