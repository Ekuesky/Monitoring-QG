# =============================================================================
# Configuration Prometheus — QG Multi-projets
#
# Chaque job porte un label "project" pour segmenter les métriques.
# POUR AJOUTER UN PROJET : décommenter/dupliquer les blocs commentés.
# Hot-reload sans redémarrage : curl -X POST http://localhost:19090/-/reload
# =============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

rule_files:
  - "alerts.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

# =============================================================================
# SCRAPE CONFIGURATIONS
# =============================================================================
scrape_configs:

  # ---------------------------------------------------------------------------
  # Prometheus — auto-monitoring
  # ---------------------------------------------------------------------------
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # ---------------------------------------------------------------------------
  # cAdvisor — métriques de TOUS les conteneurs Docker de l'hôte
  # ---------------------------------------------------------------------------
  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]
    metric_relabel_configs:
      # Propager container_label_project vers le label standard "project"
      - source_labels: [container_label_project]
        regex: "(.+)"
        target_label: project
      # Fallback : Si container_label_project n'est pas défini, utiliser le nom du projet Docker Compose
      - source_labels: [project, container_label_com_docker_compose_project]
        regex: ";(.+)"
        target_label: project

  # ---------------------------------------------------------------------------
  # Node Exporter — métriques matérielles de l'hôte (CPU, RAM, Disque)
  # NOTE : node_exporter n'est démarré QU'EN PRODUCTION via monitoring.prod.yml.
  #        Le job est défini ici pour que Prometheus le scrape automatiquement
  #        lorsque le service est présent. En local il sera simplement absent
  #        des targets actives (pas de conteneur = pas de scrape).
  #        → Si tu vois "DOWN" en local, c'est normal : ignorer cette alerte.
  # ---------------------------------------------------------------------------
  - job_name: "node_exporter"
    static_configs:
      - targets: ["node_exporter:9100"]

  # ===========================================================================
  # EXPORTERS APPLICATIFS — Découverte automatique par projet (file_sd)
  # Tout fichier *.yml ou *.json placé dans /etc/prometheus/targets/ est
  # automatiquement détecté et scrapé à chaud par Prometheus (sans redémarrage).
  # ===========================================================================
  - job_name: "projects"
    honor_labels: true
    file_sd_configs:
      - files:
          - "/etc/prometheus/targets/*.yml"
          - "/etc/prometheus/targets/*.json"
        refresh_interval: 10s

