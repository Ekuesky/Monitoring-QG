# =============================================================================
# Règles d'alertes Prometheus — QG Multi-projets
# Toutes les alertes incluent {{ $labels.project }} pour identifier le projet.
# =============================================================================

groups:

  # ---------------------------------------------------------------------------
  # ALERTES SYSTÈME — CPU, RAM, Disque
  # ---------------------------------------------------------------------------
  - name: system_alerts
    rules:

      - alert: ContainerHighMemoryUsage
        expr: |
          (container_memory_usage_bytes{name!=""} / (container_spec_memory_limit_bytes{name!=""} > 0)) * 100 > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "[{{ $labels.project }}] Conteneur {{ $labels.name }} — RAM élevée"
          description: "Le conteneur {{ $labels.name }} (projet: {{ $labels.project }}) utilise {{ $value | printf \"%.0f\" }}% de sa RAM allouée depuis plus de 5 minutes."

      - alert: ContainerHighCpuUsage
        expr: |
          (sum by (name, project) (rate(container_cpu_usage_seconds_total{name!=""}[5m])) / scalar(machine_cpu_cores)) * 100 > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "[{{ $labels.project }}] Conteneur {{ $labels.name }} — CPU saturé"
          description: "Le conteneur {{ $labels.name }} (projet: {{ $labels.project }}) utilise {{ $value | printf \"%.0f\" }}% des ressources CPU globales du serveur depuis plus de 5 minutes."

      - alert: ContainerDown
        expr: |
          absent(container_last_seen{name!=""})
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Conteneur non détecté"
          description: "Un conteneur n'est plus détecté par cAdvisor depuis 1 minute."

  # ---------------------------------------------------------------------------
  # ALERTES HÔTE PHYSIQUE / SERVEUR (Node Exporter — Production)
  # ---------------------------------------------------------------------------
  - name: host_alerts
    rules:

      - alert: HostOutOfDiskSpace
        expr: |
          (node_filesystem_avail_bytes{mountpoint="/rootfs"} / node_filesystem_size_bytes{mountpoint="/rootfs"}) * 100 < 10
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Espace disque critique sur le serveur hôte (< 10% restant)"
          description: "Le disque principal du serveur n'a plus que {{ $value | printf \"%.1f\" }}% d'espace libre."

      - alert: HostDiskWillFillIn24Hours
        expr: |
          predict_linear(node_filesystem_free_bytes{mountpoint="/rootfs"}[1h], 86400) < 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Le disque du serveur risque d'être plein dans moins de 24h"
          description: "Selon le rythme actuel d'écriture, la partition racine sera saturée dans les 24 prochaines heures."

      - alert: HostHighMemoryUsage
        expr: |
          (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Utilisation RAM serveur hôte critique (> 90%)"
          description: "L'hôte utilise {{ $value | printf \"%.1f\" }}% de sa mémoire RAM physique disponible."

      - alert: HostHighCpuLoad
        expr: |
          100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Charge CPU serveur hôte élevée (> 90%)"
          description: "La charge CPU moyenne du serveur hôte est à {{ $value | printf \"%.1f\" }}% depuis 5 minutes."

  # ---------------------------------------------------------------------------
  # ALERTES POSTGRESQL
  # ---------------------------------------------------------------------------
  - name: postgres_alerts
    rules:

      - alert: PostgresDown
        expr: pg_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "[{{ $labels.project }}] PostgreSQL est DOWN"
          description: "L'exporter PostgreSQL (projet: {{ $labels.project }}) ne peut plus se connecter à la base de données."

      - alert: PostgresTooManyConnections
        expr: |
          pg_stat_database_numbackends / pg_settings_max_connections * 100 > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "[{{ $labels.project }}] PostgreSQL — Connexions saturées"
          description: "PostgreSQL ({{ $labels.project }}) utilise {{ $value | printf \"%.0f\" }}% de ses connexions disponibles."

      - alert: PostgresHighRollbackRate
        expr: |
          rate(pg_stat_database_xact_rollback[5m]) / (rate(pg_stat_database_xact_commit[5m]) + rate(pg_stat_database_xact_rollback[5m])) * 100 > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "[{{ $labels.project }}] PostgreSQL — Taux de rollback élevé"
          description: "Le taux de rollback PostgreSQL ({{ $labels.project }}) est de {{ $value | printf \"%.1f\" }}% sur les 5 dernières minutes."

      - alert: PostgresDeadlocks
        expr: rate(pg_stat_database_deadlocks[5m]) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "[{{ $labels.project }}] PostgreSQL — Deadlocks détectés"
          description: "Des deadlocks PostgreSQL ont été détectés dans la base {{ $labels.datname }} (projet: {{ $labels.project }})."

  # ---------------------------------------------------------------------------
  # ALERTES REDIS
  # ---------------------------------------------------------------------------
  - name: redis_alerts
    rules:

      - alert: RedisDown
        expr: redis_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "[{{ $labels.project }}] Redis est DOWN"
          description: "L'exporter Redis (projet: {{ $labels.project }}) ne peut plus se connecter à Redis."

      - alert: RedisHighMemoryUsage
        expr: |
          (redis_memory_used_bytes / (redis_config_maxmemory > 0)) * 100 > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "[{{ $labels.project }}] Redis — Mémoire élevée"
          description: "Redis ({{ $labels.project }}) utilise {{ $value | printf \"%.0f\" }}% de sa mémoire maximale configurée."

      - alert: RedisEvictions
        expr: increase(redis_evicted_keys_total[5m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "[{{ $labels.project }}] Redis — Éviction de clés détectée"
          description: "Redis ({{ $labels.project }}) a expulsé {{ $value }} clés au cours des 5 dernières minutes."

  # ---------------------------------------------------------------------------
  # ALERTES NGINX
  # ---------------------------------------------------------------------------
  - name: nginx_alerts
    rules:

      - alert: NginxDown
        expr: nginx_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "[{{ $labels.project }}] Nginx est DOWN"
          description: "L'exporter Nginx (projet: {{ $labels.project }}) ne peut plus scraper les métriques de Nginx."

      - alert: NginxHighConnections
        expr: nginx_connections_active > 1000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "[{{ $labels.project }}] Nginx — Connexions actives élevées"
          description: "Nginx ({{ $labels.project }}) a {{ $value }} connexions actives, ce qui peut indiquer une surcharge."

  # ---------------------------------------------------------------------------
  # ALERTES CELERY / WORKERS
  # ---------------------------------------------------------------------------
  - name: celery_alerts
    rules:

      - alert: CeleryWorkerDown
        expr: flower_workers_total == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "[{{ $labels.project }}] Celery — Aucun worker actif"
          description: "Flower ({{ $labels.project }}) ne détecte plus aucun worker Celery actif depuis 2 minutes."

      - alert: CeleryTasksBacklog
        expr: flower_tasks_total{state="PENDING"} > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "[{{ $labels.project }}] Celery — File d'attente saturée"
          description: "Il y a {{ $value }} tâches en attente dans la queue Celery (projet: {{ $labels.project }})."
