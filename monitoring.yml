# =============================================================================
# Monitoring QG — Stack multi-projets (Architecture Hybride)
# Usage: docker compose -f monitoring.yml up -d
#
# AJOUT D'UN NOUVEAU PROJET :
#   1. docker network create <projet>_network
#   2. ./add-project.sh <projet>
#   3. Éditer les blocs commentés ci-dessous et dans prometheus/prometheus.yml
#   4. docker compose -f monitoring.yml up -d --no-deps <nouveaux_exporters>
#   5. curl -X POST http://localhost:19090/-/reload
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # PROMETHEUS — Collecte et stockage des métriques
  # Accès : http://localhost:19090
  # NOTE : Port 19090 (et non 9090) pour éviter le conflit avec koda_nginx
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: monitoring_prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--web.enable-lifecycle"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "19090:9090"
    networks:
      - monitoring_network

  # ---------------------------------------------------------------------------
  # ALERTMANAGER — Gestion et envoi des alertes (Email, Slack…)
  # Accès : http://localhost:9093
  # ---------------------------------------------------------------------------
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: monitoring_alertmanager
    restart: unless-stopped
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    ports:
      - "9093:9093"
    networks:
      - monitoring_network

  # ---------------------------------------------------------------------------
  # GRAFANA — Tableaux de bord et visualisation
  # Accès : http://localhost:3001
  # Identifiants par défaut : admin / admin (à changer !)
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:11.0.0
    container_name: monitoring_grafana
    restart: unless-stopped
    env_file:
      - ./grafana/.env.grafana
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
      - loki
    networks:
      - monitoring_network

  # ---------------------------------------------------------------------------
  # LOKI — Centralisation des logs
  # ---------------------------------------------------------------------------
  loki:
    image: grafana/loki:3.0.0
    container_name: monitoring_loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - ./loki/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
    ports:
      - "3100:3100"
    networks:
      - monitoring_network

  # ---------------------------------------------------------------------------
  # PROMTAIL — Collecte les logs de TOUS les conteneurs Docker → Loki
  # Utilise docker_sd_configs pour auto-découverte (lecture seule)
  # ---------------------------------------------------------------------------
  promtail:
    image: grafana/promtail:3.0.0
    container_name: monitoring_promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/promtail.yml
    volumes:
      - ./promtail/promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - monitoring_network

  # ---------------------------------------------------------------------------
  # cADVISOR — Métriques des conteneurs Docker (hôte entier)
  # Accès : http://localhost:8081
  # ---------------------------------------------------------------------------
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.2
    container_name: monitoring_cadvisor
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /cgroup:/cgroup:ro
    ports:
      - "8081:8080"
    networks:
      - monitoring_network

  # ---------------------------------------------------------------------------
  # UPTIME KUMA — Surveillance de la disponibilité des endpoints
  # Accès : http://localhost:3002
  # ---------------------------------------------------------------------------
  uptime_kuma:
    image: louislam/uptime-kuma:1.23.13
    container_name: monitoring_uptime_kuma
    restart: unless-stopped
    volumes:
      - uptime_kuma_data:/app/data
    ports:
      - "3002:3001"
    networks:
      - monitoring_network

  # ===========================================================================
  # EXPORTERS — Koda
  # Chaque exporter se connecte au réseau du projet (koda_network) pour
  # atteindre les services applicatifs, ET au réseau monitoring pour
  # être scrapé par Prometheus.
  # ===========================================================================

  postgres_exporter_koda:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: monitoring_postgres_koda
    restart: unless-stopped
    env_file:
      - ./exporters/koda/.env.postgres_exporter
    ports:
      - "9187:9187"
    networks:
      - koda_network
      - monitoring_network
    labels:
      project: "koda"
      service: "postgres"

  redis_exporter_koda:
    image: oliver006/redis_exporter:v1.61.0
    container_name: monitoring_redis_koda
    restart: unless-stopped
    environment:
      REDIS_ADDR: "redis://koda_redis:6379"
    ports:
      - "9121:9121"
    networks:
      - koda_network
      - monitoring_network
    labels:
      project: "koda"
      service: "redis"

  nginx_exporter_koda:
    image: nginx/nginx-prometheus-exporter:1.1.0
    container_name: monitoring_nginx_koda
    restart: unless-stopped
    command:
      - "--nginx.scrape-uri=http://koda_nginx/nginx_status"
    ports:
      - "9113:9113"
    networks:
      - koda_network
      - monitoring_network
    labels:
      project: "koda"
      service: "nginx"

  # ---------------------------------------------------------------------------
  # Flower (Celery) — Koda
  # Flower expose nativement /metrics sur :5555 — pas d'exporter supplémentaire
  # Le job Prometheus "flower_koda" scrape directement koda_flower:5555
  # ---------------------------------------------------------------------------
  # NOTE : Aucun conteneur supplémentaire nécessaire ici.

  # ===========================================================================
  # EXPORTERS — <ProjetX>  (décommenter et dupliquer pour un nouveau projet)
  # ===========================================================================

  # postgres_exporter_projetx:
  #   image: prometheuscommunity/postgres-exporter:v0.15.0
  #   container_name: monitoring_postgres_projetx
  #   restart: unless-stopped
  #   env_file:
  #     - ./exporters/projetx/.env.postgres_exporter
  #   ports:
  #     - "9188:9187"
  #   networks:
  #     - projetx_network
  #     - monitoring_network
  #   labels:
  #     project: "projetx"
  #     service: "postgres"

volumes:
  prometheus_data:
  alertmanager_data:
  grafana_data:
  loki_data:
  uptime_kuma_data:

networks:
  monitoring_network:
    driver: bridge
  koda_network:
    external: true
  # projetx_network:
  #   external: true
