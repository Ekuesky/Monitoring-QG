# =============================================================================
# Monitoring QG — Stack multi-projets (Architecture Hybride)
# Usage: docker compose -f monitoring.yml up -d
#
# AJOUT D'UN NOUVEAU PROJET :
#   1. docker network create <projet>_network
#   2. ./add-project.sh <projet>
#   3. Éditer les blocs commentés ci-dessous et dans prometheus/prometheus.yml
#   4. docker compose -f monitoring.yml up -d --no-deps <nouveaux_exporters>
#   5. curl -X POST http://localhost:19090/-/reload
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # PROMETHEUS — Collecte et stockage des métriques
  # Accès : http://localhost:19090
  # NOTE : Port 19090 (et non 9090) pour éviter le conflit avec koda_nginx
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    container_name: monitoring_prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--web.enable-lifecycle"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./prometheus/targets:/etc/prometheus/targets:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-19090}:9090"
    networks:
      - monitoring_network

  # ---------------------------------------------------------------------------
  # ALERTMANAGER — Gestion et envoi des alertes (Email, Slack…)
  # Accès : http://localhost:9093
  # ---------------------------------------------------------------------------
  alertmanager:
    image: prom/alertmanager:v0.33.1@sha256:9e082985f56f4c8c9f724e18f2288c6708f472e56a5286b8863d080434ea065d
    container_name: monitoring_alertmanager
    restart: unless-stopped
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    ports:
      - "${ALERTMANAGER_PORT:-9093}:9093"
    networks:
      - monitoring_network

  # ---------------------------------------------------------------------------
  # GRAFANA — Tableaux de bord et visualisation
  # Accès : http://localhost:3001
  # Identifiants par défaut : admin / admin (à changer !)
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:13.2.3@sha256:b28bae15e219c998fb0e0424ed724930cc61b1f61fb404d47c862f9a23f9e572
    container_name: monitoring_grafana
    restart: unless-stopped
    env_file:
      - ./grafana/.env.grafana
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    depends_on:
      - prometheus
    networks:
      - monitoring_network

  # ---------------------------------------------------------------------------
  # LOKI — Centralisation des logs
  # ---------------------------------------------------------------------------
  loki:
    image: grafana/loki:3.7.3@sha256:70b9f699fc9bb868b62f1cfd4f787dfa50242f1fd92e6089787d5d7daea75fe8
    container_name: monitoring_loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - ./loki/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
    ports:
      - "${LOKI_PORT:-3100}:3100"
    networks:
      - monitoring_network

  # ---------------------------------------------------------------------------
  # ALLOY (ex-Promtail) — Collecte les logs de TOUS les conteneurs Docker → Loki
  # Promtail est EOL depuis mars 2026 ; remplacé par Grafana Alloy (LTS)
  # Utilise docker_sd pour auto-découverte (lecture seule)
  # Accès UI : http://localhost:12345
  # ---------------------------------------------------------------------------
  alloy:
    image: grafana/alloy:v1.20.0@sha256:f111cce835516c5f99166342be7038496b52ced16667be5a11e19258a3e4cd30
    container_name: monitoring_alloy
    restart: unless-stopped
    command:
      - run
      - /etc/alloy/config.alloy
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "${ALLOY_PORT:-12345}:12345"
    networks:
      - monitoring_network

  # ---------------------------------------------------------------------------
  # cADVISOR — Métriques des conteneurs Docker (hôte entier)
  # Accès : http://localhost:8081
  # ---------------------------------------------------------------------------
  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.6@sha256:b8e7d1093144fd088f425ff003d75a4aa405de075db78dae3bc563730b1bd07a
    container_name: monitoring_cadvisor
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
    ports:
      - "${CADVISOR_PORT:-8081}:8080"
    networks:
      - monitoring_network

  # ---------------------------------------------------------------------------
  # UPTIME KUMA — Surveillance de la disponibilité des endpoints
  # Accès : http://localhost:3002
  # ---------------------------------------------------------------------------
  uptime_kuma:
    image: louislam/uptime-kuma:1.23.13@sha256:96510915e6be539b76bcba2e6873591c67aca8a6075ff09f5b4723ae47f333fc
    container_name: monitoring_uptime_kuma
    restart: unless-stopped
    volumes:
      - uptime_kuma_data:/app/data
    ports:
      - "${UPTIME_KUMA_PORT:-3002}:3001"
    networks:
      - monitoring_network

volumes:
  prometheus_data:
  alertmanager_data:
  grafana_data:
  loki_data:
  uptime_kuma_data:

networks:
  monitoring_network:
    driver: bridge
