# =============================================================================
# Configuration Alertmanager — QG Multi-projets
# Les alertes sont groupées par projet (label "project").
# Secrets (email, webhook) dans alertmanager/.env.alertmanager (non commité).
#
# NOTE : Alertmanager ne substitue PAS les variables d'environnement.
# Le placeholder ${ALERT_EMAIL} est remplacé au démarrage du conteneur
# (voir entrypoint du service alertmanager dans monitoring.yml).
# → Après modification de ce fichier ou du .env : redémarrer le conteneur.
# =============================================================================

global:
  resolve_timeout: 5m
  smtp_smarthost: "mailpit:8025"
  smtp_from: "alertes@monitoring.local"
  smtp_require_tls: false

templates:
  - "/etc/alertmanager/templates/*.tmpl"

# =============================================================================
# ROUTING
# =============================================================================
route:
  receiver: "team-email"
  group_by: ["alertname", "severity", "project"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

  routes:
    - matchers:
        - severity = "critical"
      receiver: "critical-alerts"
      repeat_interval: 1h

    - matchers:
        - severity = "warning"
      receiver: "team-email"
      repeat_interval: 4h

# =============================================================================
# RECEIVERS
# =============================================================================
receivers:

  # Alertes critiques : Email + Slack/Discord
  - name: "critical-alerts"
    email_configs:
      - to: "${ALERT_EMAIL}"              # Défini dans alertmanager/.env.alertmanager
        send_resolved: true
        headers:
          Subject: "[CRITIQUE][{{ .CommonLabels.project | default \"monitoring\" }}] {{ .CommonLabels.alertname }}"

    # Slack — décommenter et renseigner SLACK_WEBHOOK_URL dans .env.alertmanager
    # slack_configs:
    #   - api_url: "${SLACK_WEBHOOK_URL}"
    #     channel: "#alertes-monitoring"
    #     title: "🚨 [{{ .CommonLabels.project | default \"monitoring\" }}] {{ .CommonLabels.alertname }}"
    #     text: "{{ range .Alerts }}{{ .Annotations.description }}\n{{ end }}"
    #     send_resolved: true

    # Discord — décommenter et renseigner DISCORD_WEBHOOK_URL dans .env.alertmanager
    # slack_configs:
    #   - api_url: "${DISCORD_WEBHOOK_URL}/slack"
    #     channel: ""
    #     title: "🚨 [{{ .CommonLabels.project | default \"monitoring\" }}] {{ .CommonLabels.alertname }}"
    #     text: "{{ range .Alerts }}{{ .Annotations.description }}\n{{ end }}"
    #     send_resolved: true

  # Alertes warning : Email seulement
  - name: "team-email"
    email_configs:
      - to: "${ALERT_EMAIL}"              # Défini dans alertmanager/.env.alertmanager
        send_resolved: true
        headers:
          Subject: "[WARNING][{{ .CommonLabels.project | default \"monitoring\" }}] {{ .CommonLabels.alertname }}"

# =============================================================================
# INHIBITION
# =============================================================================
inhibit_rules:
  - source_matchers:
      - severity = "critical"
    target_matchers:
      - severity = "warning"
    equal: ["alertname", "project"]
