# =============================================================================
# Configuration Alertmanager
# Gère l'envoi des alertes Prometheus vers les canaux de notification
# =============================================================================

global:
  resolve_timeout: 5m
  # Configuration SMTP pour les alertes email
  smtp_smarthost: "mailpit:8025"          # En local, utilise Mailpit
  smtp_from: "alertes@koda.local"
  smtp_require_tls: false

# =============================================================================
# TEMPLATES (optionnel — pour personnaliser le format des messages)
# =============================================================================
templates:
  - "/etc/alertmanager/templates/*.tmpl"

# =============================================================================
# ROUTING — Comment router chaque alerte
# =============================================================================
route:
  # Destinataire par défaut
  receiver: "team-email"
  group_by: ["alertname", "severity"]
  group_wait: 30s      # Attente avant d'envoyer la première notification du groupe
  group_interval: 5m   # Intervalle minimum entre deux notifications du même groupe
  repeat_interval: 4h  # Renvoi de l'alerte si elle n'est toujours pas résolue

  # Règles de routing spécifiques
  routes:
    # Alertes critiques → Email + Slack
    - match:
        severity: critical
      receiver: "critical-alerts"
      repeat_interval: 1h

    # Alertes warning → Email seulement
    - match:
        severity: warning
      receiver: "team-email"
      repeat_interval: 4h

# =============================================================================
# RECEIVERS — Canaux de notification
# =============================================================================
receivers:

  # Alertes critiques : Email + Slack
  - name: "critical-alerts"
    email_configs:
      - to: "ton-email@example.com"         # ← Remplace par ton email
        send_resolved: true
        headers:
          Subject: "[CRITIQUE][Koda] {{ .CommonLabels.alertname }}"
    # Décommente et configure si tu veux les alertes Slack
    # slack_configs:
    #   - api_url: "https://hooks.slack.com/services/TON/WEBHOOK/URL"
    #     channel: "#alertes-koda"
    #     title: "🚨 [CRITIQUE] {{ .CommonLabels.alertname }}"
    #     text: "{{ range .Alerts }}{{ .Annotations.description }}{{ end }}"
    #     send_resolved: true

  # Alertes warning : Email seulement
  - name: "team-email"
    email_configs:
      - to: "ton-email@example.com"         # ← Remplace par ton email
        send_resolved: true
        headers:
          Subject: "[WARNING][Koda] {{ .CommonLabels.alertname }}"

# =============================================================================
# INHIBITION — Supprime certaines alertes quand une autre est déjà active
# (ex: ne pas alerter sur Redis si le serveur entier est DOWN)
# =============================================================================
inhibit_rules:
  - source_match:
      severity: "critical"
    target_match:
      severity: "warning"
    equal: ["alertname"]
